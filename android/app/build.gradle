apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

Properties properties = new Properties()
properties.load(project.rootProject.file('local.properties').newDataInputStream())
def googleMapApiKey = properties.getProperty('google.map.key')

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.thewalks"
    defaultConfig {
        applicationId "com.thewalks"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 37
        versionName "5.0.1"
        manifestPlaceholders = [googleMapApiKey: googleMapApiKey]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    flavorDimensions "version"
    productFlavors {
        standard {
            dimension "version"
            applicationId "com.thewalks"
        }
        pro {
            dimension "version"
            applicationId "com.thewalkspro"
        }
    }

    sourceSets {
        standard {
            assets.srcDirs = ['src/standard/assets']
            res.srcDirs = ['src/standard/res', 'src/main/res']
        }
        pro {
            assets.srcDirs = ['src/pro/assets']
            res.srcDirs = ['src/pro/res', 'src/main/res']
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

// Move google-services.json based on build variant
android.applicationVariants.all { variant ->
    def flavor = variant.productFlavors[0].name
    def variantName = variant.name

    project.afterEvaluate {
        def processGoogleServices = tasks.named("process${variantName.capitalize()}GoogleServices")
        def generateResources = tasks.named("generate${variantName.capitalize()}Resources")
        def mergeResources = tasks.named("merge${variantName.capitalize()}Resources")

        generateResources.configure {
            dependsOn(processGoogleServices)
            mustRunAfter(processGoogleServices)
        }

        mergeResources.configure {
            dependsOn(generateResources)
            mustRunAfter(generateResources)
        }

        // Configure merge tasks after project evaluation
        tasks.configureEach { task ->
            if (task.name.startsWith("merge") && 
                task.name.contains(variantName) &&
                (task.name.contains("Dex") || task.name.contains("JniLibFolders"))) {
                
                task.dependsOn(processGoogleServices)
                task.dependsOn(mergeResources)
                task.mustRunAfter(processGoogleServices)
                task.mustRunAfter(mergeResources)
            }
        }

        // Configure shader merging if it exists
        def shaderTask = tasks.findByName("merge${variantName.capitalize()}Shaders")
    }
}

// Apply google-services plugin after variant configuration
apply plugin: 'com.google.gms.google-services'
